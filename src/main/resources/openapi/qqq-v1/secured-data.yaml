components:
  schemas:
    BasicErrorResponseV1:
      description: "The error body of every UI API operation (core and extensions)."
      properties:
        error:
          description: "The error message (the same as message; kept for clients of\
            \ UI API 1.0 to 1.5)."
          type: "string"
        code:
          description: "A stable, machine-readable code. Well-known values: BAD_REQUEST\
            \ (400), UNAUTHENTICATED (401),\nPERMISSION_DENIED (403), NOT_FOUND (404),\
            \ CONFLICT (409), RATE_LIMITED (429), INTERNAL_ERROR (500),\nERROR (other).\
            \ Extensions may add codes; treat an unknown code by the HTTP status.\
            \ Since 1.6.0."
          type: "string"
        message:
          description: "A message to show the user. Since 1.6.0."
          type: "string"
        fieldErrors:
          description: "Errors about particular request fields, when known. Since\
            \ 1.6.0."
          items:
            properties:
              field:
                description: "The field (or parameter) name."
                type: "string"
              message:
                description: "The error about that field."
                type: "string"
              code:
                description: "An optional machine-readable code, e.g. REQUIRED, TOO_LONG,\
                  \ PATTERN."
                type: "string"
            type: "object"
          type: "array"
        traceId:
          description: "Identifies this request in the server logs (also the X-QQQ-Trace-Id\
            \ response header); quote it when reporting a problem. Since 1.6.0."
          type: "string"
      type: "object"
    SecuredDataBreakGlassV1:
      properties:
        id:
          type: "integer"
        reason:
          type: "string"
        expiresAt:
          format: "date-time"
          type: "string"
        scope:
          nullable: true
          type: "string"
        ceiling:
          type: "string"
      type: "object"
    SecuredDataErrorV1:
      description: "Deprecated since 1.1.0: errors use BasicErrorResponseV1."
      properties:
        error:
          type: "string"
      type: "object"
    SecuredDataRevealAllowanceV1:
      properties:
        tableName:
          type: "string"
        fieldName:
          type: "string"
        remainingDailyAllowance:
          nullable: true
          type: "integer"
      type: "object"
    SecuredDataRevealOptionsResponseV1:
      properties:
        reasonOptions:
          items:
            type: "string"
          type: "array"
        allowFreeTextReason:
          type: "boolean"
        requireFreeText:
          type: "boolean"
        revealMinutes:
          type: "integer"
        remainingDailyAllowance:
          nullable: true
          type: "integer"
      type: "object"
    SecuredDataRevealRequestV1:
      description: "tableName, primaryKey and fieldName are required. Supply a policy\
        \ reason or allowed free text; maximum 500 characters."
      properties:
        tableName:
          type: "string"
        fieldName:
          type: "string"
        primaryKey:
          anyOf:
          - type: "string"
          - type: "number"
          description: "Record primary key (string or number)."
        reason:
          maxLength: 500
          nullable: true
          type: "string"
        reasonText:
          maxLength: 500
          nullable: true
          type: "string"
      type: "object"
    SecuredDataRevealResponseV1:
      properties:
        value:
          description: "Authorized raw field value."
          nullable: true
        displayValue:
          nullable: true
          type: "string"
        expiresAt:
          format: "date-time"
          type: "string"
        revealId:
          type: "integer"
      type: "object"
    SecuredDataStatusResponseV1:
      properties:
        breakGlass:
          $ref: "#/components/schemas/SecuredDataBreakGlassV1"
          nullable: true
        revealsUsedToday:
          type: "integer"
        revealAllowances:
          items:
            $ref: "#/components/schemas/SecuredDataRevealAllowanceV1"
          type: "array"
      type: "object"
  securitySchemes:
    sessionUuidCookie:
      description: "The session cookie set by POST /qqq/v1/manageSession (web clients)."
      in: "cookie"
      name: "sessionUUID"
      type: "apiKey"
    bearerAuth:
      bearerFormat: "JWT or session UUID"
      description: "`Authorization: Bearer <token>`, where the token is either\n-\
        \ an OAuth2 access token (a signed JWT) issued by the app's identity provider\
        \ to the app's client,\n  or to its native client (`values.nativeClientId`\
        \ in GET /qqq/v1/metaData/authentication), for\n  example from the device-authorization\
        \ grant or auth-code + PKCE. It is verified against the\n  provider's keys\
        \ (issuer, audience, expiry, signature) and gives the same user and permissions\n\
        \  as signing in on the web. When it expires (401), refresh it at the provider\
        \ and retry; or\n- a session UUID returned by POST /qqq/v1/manageSession,\
        \ which the server keeps refreshed."
      scheme: "bearer"
      type: "http"
    oauth2:
      description: "The app's OAuth2 / OpenID Connect provider. The real endpoints\
        \ come from the provider's discovery\ndocument: `{values.baseUrl}.well-known/openid-configuration`,\
        \ with values from\nGET /qqq/v1/metaData/authentication. Native clients use\
        \ `values.nativeClientId` (a public client)\nwith auth-code + PKCE (loopback\
        \ or custom-scheme redirect URI registered at the provider) or the\ndevice-authorization\
        \ grant (`device_authorization_endpoint`, RFC 8628), then send the access\
        \ token\nas `Authorization: Bearer`."
      flows:
        authorizationCode:
          authorizationUrl: "/authorize"
          scopes:
            email: "Email address"
            offline_access: "A refresh token, to renew the access token without signing\
              \ in again"
            openid: "OpenID Connect sign-in"
            profile: "Name, username and groups (permissions come from the groups)"
          tokenUrl: "/token"
      type: "oauth2"
info:
  contact:
    email: "contact@kingsrook.com"
  description: "Reveal grants and break-glass status"
  title: "QQQ Middleware API extension: secured-data"
  version: "1.1.0"
openapi: "3.0.3"
paths:
  /qqq/v1/qbit/secured-data/reveal:
    post:
      operationId: "postQbitSecuredDataReveal"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecuredDataRevealRequestV1"
        required: true
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid reveal request"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Reveal denied"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Record not found or locked"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuredDataRevealResponseV1"
          description: "Successful Response"
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Daily reveal cap reached"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not authenticated, or the session or token is invalid or expired\
            \ (code UNAUTHENTICATED). Sign in again, or refresh the token."
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Reveal"
      tags:
      - "secured-data"
  /qqq/v1/qbit/secured-data/reveal/options:
    get:
      operationId: "getQbitSecuredDataRevealOptions"
      parameters:
      - in: "query"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - in: "query"
        name: "fieldName"
        required: true
        schema:
          type: "string"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuredDataRevealOptionsResponseV1"
          description: "Successful Response"
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Bad request: a parameter or the body is invalid (code BAD_REQUEST);\
            \ fieldErrors may name the fields."
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not authenticated, or the session or token is invalid or expired\
            \ (code UNAUTHENTICATED). Sign in again, or refresh the token."
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "The user (or the credential's scope) may not do this (code\
            \ PERMISSION_DENIED)."
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found, or not visible to this user (code NOT_FOUND)."
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "RevealOptions"
      tags:
      - "secured-data"
  /qqq/v1/qbit/secured-data/status:
    get:
      operationId: "getQbitSecuredDataStatus"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuredDataStatusResponseV1"
          description: "Successful Response"
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Bad request: a parameter or the body is invalid (code BAD_REQUEST);\
            \ fieldErrors may name the fields."
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not authenticated, or the session or token is invalid or expired\
            \ (code UNAUTHENTICATED). Sign in again, or refresh the token."
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "The user (or the credential's scope) may not do this (code\
            \ PERMISSION_DENIED)."
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found, or not visible to this user (code NOT_FOUND)."
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Status"
      tags:
      - "secured-data"
servers:
- description: "The QQQ server that serves this document (paths include /qqq/v1)."
  url: "/"
tags:
- description: "Operations of the secured-data extension."
  name: "secured-data"
